services:
  web:
    build: .
    command: >
        bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py csu && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./.env
    volumes:
      - .:/app
      - media:/app/media
      - static_volume:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
  celery:
    build: .
    command: >
      bash -c "celery -A config worker --loglevel=info --pool=solo"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
  celery_beat:
    build: .
    command: >
      bash -c "celery -A config worker -l INFO"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
      - celery

volumes:
  postgres_data:
  static_volume:
  media:
  redis_data:
